<div class="overlay">
    <div class="dialog-panel">
        <header>{{ title() }}</header>
        <p class="message">{{ message() }}</p>
        <div class="actions">
            <button matButton="filled" type="button" (click)="confirmed.emit()">Yes</button>
            <button matButton="filled" type="button" (click)="cancelled.emit()">No</button>
        </div>
    </div>
</div>
