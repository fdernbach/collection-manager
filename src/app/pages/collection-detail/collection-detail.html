<header id="collection-header">
  <h1>My Collection</h1>
  <div>
    <app-search-bar [(search)]="searchText"></app-search-bar>
  </div>
</header>
<section class="collection-grid">
  @for (item of collectionItems(); track item.name) {
    @switch (item.rarity) {
      @case ('Legendary') {
        <div [routerLink]="['/item', item.id]">
          <app-collection-item-card [item]="item"></app-collection-item-card>
          <hr class="gold"/>
        </div>
      }
      @case ('Rare') {
        <div [routerLink]="['/item', item.id]">
          <app-collection-item-card [item]="item"></app-collection-item-card>
          <hr class="grey"/>
        </div>

      }
      @default {
        <div [routerLink]="['/item', item.id]">
          <app-collection-item-card [item]="item"></app-collection-item-card>
          <hr class="hidden"/>
        </div>
      }
    }
  }
</section>
@let itemCount = collectionItems()?.length;
@if (itemCount) {
  <div class="centered">Found {{itemCount}} items</div>
} @else {
  <div class="centered">No item found</div>
}
<div class="centered"><button matButton="filled" [routerLink]="['/item']">Add Item</button></div>
